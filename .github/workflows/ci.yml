name: Sensei CI

on:
  push:
    branches: [ "v1.x_stagging" ]
  pull_request:
    branches: [ "v1.x_stagging" ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Unit Tests
        run: docker compose up --build --abort-on-container-exit discord_bot_tests

      - name: Upload Test Report
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: discord_bot/report.html
          retention-days: 7
